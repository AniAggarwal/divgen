# Pink-noise initialization variant (alpha=0.2): generation 0 is the paper's
# pink-noise i.i.d. baseline; evolution improves on it.
paths: {cache_dir: ./cache, save_dir: ./outputs}
model: {name: sdxl-turbo, dtype: float16}
optimization: {n_inference_steps: 1, noise_type: pink, noise_exponent: 0.2}
rewards:
  clip: {enable: true, weighting: 1.0}
diversity:
  dino: {enable: true, weight: 1.0, model_name: facebook/dinov2-base}
task: {type: geneval, prompt_start_index: 0, prompt_end_index: 10}
evolution:
  pop_size: 40
  n_generations: 60
  set_size: 4
  self_adaptive: true
  render_chunk: 160
  log_all_every: 15
  seed: 0
