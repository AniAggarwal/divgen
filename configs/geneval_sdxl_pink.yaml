# Paper Tab. 2 - SDXL-Turbo, GenEval, pink noise (alpha=0.2), DPP + HPSv2
# Hyperparameters: lambda_div=150 (DPP), lambda_q=3 (HPS), lr=6, gc=0.1, n_iters=150

paths:
  cache_dir: "./cache"
  save_dir: "./outputs"

model:
  name: "sdxl-turbo"
  dtype: "float16"
  device_id: 0
  cpu_offloading: false

optimization:
  lr: 6.0
  n_iters: 150
  n_inference_steps: 1
  num_samples: 4
  optim: "sgd"
  grad_clip: 0.1
  seed: 42
  noise_type: "pink"
  noise_exponent: 0.2

regularization:
  enable: true
  weight: 0.01

rewards:
  hps:
    enable: true
    weighting: 3.0
  clip:
    enable: false

diversity:
  dino:
    enable: false
  dpp:
    enable: true
    weight: 150.0
    backend: "dino"

task:
  type: "geneval"
  prompt_start_index: null
  prompt_end_index: null

multi_step:
  enable: false
